# ===== SATU-SATUNYA TEMPAT MENGUBAH URL GAME =====
# Harus HTTPS (getUserMedia/WebRTC wajib secure context). Boleh dioverride saat build: -PGAME_URL=https://domain-lain/
GAME_URL=https://thegame-rose.vercel.app/
# Host tambahan yang boleh dibuka DI DALAM WebView (pisahkan koma). Kosongkan bila tidak ada. Permission mic TETAP hanya untuk host GAME_URL.
EXTRA_NAV_HOSTS=

# Versi (samakan dengan lib/config/appversion.ts di game: dikirim ke game lewat User-Agent "NightRound/<versi>")
APP_VERSION_NAME=1.0.0
APP_VERSION_CODE=1

org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=false
android.nonTransitiveRClass=true
