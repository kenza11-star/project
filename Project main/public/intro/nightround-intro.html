 [glowS,glowM,glowL].forEach(c=>{const x=c.getContext('2d'),id=x.getImageData(0,0,W,H),d=id.data;for(let i=3;i<d.length;i+=4){const a=d[i]-10;d[i]=a<0?0:a*1.0417;}x.putImageData(id,0,0);});

 const bx=Math.max(0,Math.floor(x0-fs*1.0)),by=Math.max(0,Math.floor(y0-fs*1.3)),bw=Math.min(W-bx,Math.ceil(total+fs*2.0)),bh=Math.min(H-by,Math.ceil((y1-y0)+fs*2.6));

 // ---- fog
    // ---- tmp canvases

 // slash geometry

 function bez(p0,p1,p2,u){const a=1-u;return [a*a*p0[0]+2*a*u*p1[0]+u*u*p2[0],a*a*p0[1]+2*a*u*p1[1]+u*u*p2[1]];}

   let dx=q[0]-p[0],dy=q[1]-p[1];const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;const w=s.w*W*Math.pow(Math.sin(Math.PI*clamp(u*0.96+0.02)),.7);

 function frame(t,opt){opt=opt||{};
  g.setTransform(1,0,0,1,0,0);g.globalCompositeOperation='source-over';g.globalAlpha=1;g.fillStyle='#000';g.fillRect(0,0,W,H);
  const dt=t-T_IMPACT;

    else if(flick){const slices=10;for(let s=0;s<slices;s++){const sy0=y0-10+(y1-y0+20)*s/slices,sh=(y1-y0+20)/slices;const off=(rnd(Math.floor(t*40),s)-.5)*W*.03*(rnd(Math.floor(t*40),s+9)>.6?1:0);g.drawImage(faceC,bx,sy0,bw,sh,bx+off+ox,sy0+oy,bw,sh);}}

    tg.strokeStyle='rgba(255,170,110,1)';tg.lineWidth=Math.max(2,A*.35);tg.beginPath();tg.moveTo(cx-D[0]*W,cy-D[1]*W);tg.lineTo(cx+D[0]*W,cy+D[1]*W);tg.stroke();

   // light sweep
   const su=sweepU(t);
   if(su>=0&&t>=T_IMPACT){tg.setTransform(1,0,0,1,0,0);tg.globalCompositeOperation='source-over';tg.clearRect(bx,by,bw,bh);
    const sbx=lerp(x0-W*.15,x0+total+W*.15,smooth(su)),sbw=W*.07;const lg=tg.createLinearGradient(sbx-sbw,cy-sbw*.9,sbx+sbw,cy+sbw*.9);
    lg.addColorStop(0,'rgba(255,255,255,0)');lg.addColorStop(.5,'rgba(255,235,210,.95)');lg.addColorStop(1,'rgba(255,255,255,0)');tg.fillStyle=lg;tg.fillRect(bx,by,bw,bh);

   for(let i=0;i<SL.length;i++){const st=2.26+i*.055,prog=clamp((t-st)/.1);if(prog<=0)continue;const poly=slashPoly(SL[i],prog);

/* ================= AUDIO ================= */
NR.audio=function(ctx,dest,opt){opt=opt||{};const live=!!opt.live,horizon=opt.horizon||10;
 const sr=ctx.sampleRate;
 // noise buffer
 const nb=ctx.createBuffer(1,sr*3,sr);{const d=nb.getChannelData(0);let s=12345;for(let i=0;i<d.length;i++){s=(Math.imul(s,1664525)+1013904223)|0;d[i]=((s>>>8)/8388608)-1;}}

 const rv=ctx.createConvolver();{const len=Math.floor(sr*3.2),ib=ctx.createBuffer(2,len,sr);for(let c=0;c<2;c++){const d=ib.getChannelData(c);let s=777+c*31;for(let i=0;i<len;i++){s=(Math.imul(s,1664525)+1013904223)|0;const n=((s>>>8)/8388608)-1;d[i]=n*Math.pow(1-i/len,2.6)*(i<sr*.02?i/(sr*.02):1);}}rv.buffer=ib;}
 const rvIn=ctx.createGain();rvIn.gain.value=1;const rvOut=ctx.createGain();rvOut.gain.value=.55;

 rvIn.connect(rv);rv.connect(rvLP);rvLP.connect(rvOut);rvOut.connect(master);
 function out(node,wet){node.connect(master);if(wet){const s=ctx.createGain();s.gain.value=wet;node.connect(s);s.connect(rvIn);}}
 function noise(t,dur,o){const s=ctx.createBufferSource();s.buffer=nb;s.loop=true;const f=ctx.createBiquadFilter();f.type=o.type||'bandpass';f.Q.value=o.q||1;f.frequency.setValueAtTime(o.f0,t);if(o.f1)f.frequency.exponentialRampToValueAtTime(o.f1,t+dur);
  const e=ctx.createGain();const a=o.a||.005;e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(o.g,t+a);if(o.hold)e.gain.setValueAtTime(o.g,t+o.hold);e.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(e);out(e,o.wet);s.start(t,rnd(Math.floor(t*100),3)*2);s.stop(t+dur+.05);}
 function tone(t,dur,o){const os=ctx.createOscillator();os.type=o.type||'sine';os.frequency.setValueAtTime(o.f0,t);if(o.f1)os.frequency.exponentialRampToValueAtTime(o.f1,t+dur);
  const e=ctx.createGain();const a=o.a||.003;e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(o.g,t+a);e.gain.exponentialRampToValueAtTime(.0001,t+dur);
  let n=os;if(o.lp){const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=o.lp;os.connect(f);n=f;}
  n.connect(e);out(e,o.wet);os.start(t);os.stop(t+dur+.05);}
 // ---- drone

 const droneLP=ctx.createBiquadFilter();droneLP.type='lowpass';droneLP.Q.value=2;droneLP.frequency.value=140;droneLP.connect(droneG);
 [[55,'sawtooth',.16],[55.35,'sawtooth',.16],[110.4,'sine',.1],[36.7,'sine',.3],[82.5,'triangle',.05]].forEach(([f,ty,gv])=>{const o=ctx.createOscillator();o.type=ty;o.frequency.value=f;const gg=ctx.createGain();gg.gain.value=gv;o.connect(gg);gg.connect(droneLP);o.start(0);if(!live)o.stop(horizon+1);});
 {const l=ctx.createOscillator();l.frequency.value=.11;const lg=ctx.createGain();lg.gain.value=40;l.connect(lg);lg.connect(droneLP.frequency);l.start(0);if(!live)l.stop(horizon+1);}
 droneLP.frequency.setValueAtTime(140,0);droneLP.frequency.linearRampToValueAtTime(520,2.35);droneLP.frequency.setTargetAtTime(230,2.5,.8);
 droneG.gain.setValueAtTime(0,0);droneG.gain.linearRampToValueAtTime(.30,2.3);droneG.gain.linearRampToValueAtTime(.02,2.46);droneG.gain.setValueAtTime(.02,2.49);droneG.gain.linearRampToValueAtTime(.42,2.6);droneG.gain.setTargetAtTime(.20,2.8,1.4);

 {const s=ctx.createBufferSource();s.buffer=nb;s.loop=true;const f=ctx.createBiquadFilter();f.type='bandpass';f.Q.value=.9;f.frequency.value=420;const l=ctx.createOscillator();l.frequency.value=.13;const lg=ctx.createGain();lg.gain.value=260;l.connect(lg);lg.connect(f.frequency);

  [196,311,487,732,1160].forEach((f,i)=>tone(t,1.0-i*.08,{f0:f,g:.11,a:.002,wet:.7}));noise(t,1.8,{type:'lowpass',f0:3000,f1:150,q:.5,g:.35,a:.003,wet:1.0});tone(t,.5,{type:'sawtooth',f0:140,f1:40,g:.3,lp:600,a:.002});}
 function shing(t,v){noise(t,1.0,{type:'highpass',f0:5200,q:.7,g:.07*v,a:.3,wet:.5});tone(t,1.0,{f0:2800,f1:3300,g:.035*v,a:.35,wet:.7});tone(t,1.0,{f0:4200,f1:4000,g:.02*v,a:.4,wet:.7});}
 function glitch(t,v){for(let i=0;i<9;i++){const tt=t+i*.03+rnd(Math.floor(t*10),i)*.012;const f=80+rnd(Math.floor(t*10),i+20)*1100;tone(tt,.028,{type:'square',f0:f,f1:f*(rnd(Math.floor(t*10),i+40)>.5?.5:2),g:.07*v,a:.001});noise(tt,.03,{type:'bandpass',f0:2000+rnd(Math.floor(t*10),i+70)*6000,q:3,g:.14*v,a:.001});}

 // intro script
 const S=[];
 [0.6,1.2,1.7,2.1].forEach((b,i)=>S.push(()=>heart(b,.55+.12*i)));

 S.push(()=>riser(1.15,2.46));
 [2.30,2.355,2.41].forEach(t=>S.push(()=>whoosh(t,1)));
 S.push(()=>impact(T_IMPACT_()));
 function T_IMPACT_(){return NR.T_IMPACT;}
 S.forEach(f=>f());
 // recurring
 function recurring(from,to){
  for(let b=3.0;b<to;b+=1.8){if(b>=from)heart(b,.42);}
  for(let s=NR.SWEEP0;s<to;s+=NR.SWEEP_P){if(s>=from)shing(s,.9);}
  for(let s=NR.GLITCH0;s<to;s+=NR.GLITCH_P){if(s>=from)glitch(s,1);}

 recurring(0,horizon);
 if(live){let upto=horizon;const base=opt.base||0;
  const tick=setInterval(()=>{const now=ctx.currentTime-base;if(now+10>upto){const nt=upto+30;
   // schedule absolute times (offset by base)
   const sched=(fn)=>fn;
   for(let b=3.0;b<nt;b+=1.8){if(b>=upto)heart(base+b,.42);}
   for(let s=NR.SWEEP0;s<nt;s+=NR.SWEEP_P){if(s>=upto)shing(base+s,.9);}
   for(let s=NR.GLITCH0;s<nt;s+=NR.GLITCH_P){if(s>=upto)glitch(base+s,1);}
   upto=nt;}},4000);
  return {stop(){clearInterval(tick);}};}

};
global.NR=NR;
})(window);

<script>
(function(){
 const canvas=document.getElementById('c'),start=document.getElementById('start');
 let sc=null,ctx=null,raf=0;
 const W=960;
 function init(){return document.fonts.load("700 100px NRF").then(()=>{sc=NR.create(canvas,W,Math.round(W*9/16),'NRF');sc.frame(0);});}
 const ready=init();
 function run(){
  cancelAnimationFrame(raf);
  if(ctx){try{ctx.close();}catch(e){}}
  const AC=window.AudioContext||window.webkitAudioContext;
  try{ctx=new AC();NR.audio(ctx,ctx.destination,{live:true,horizon:10});if(ctx.state==='suspended'){const rp=ctx.resume();if(rp&&rp.catch)rp.catch(()=>{});}}catch(e){ctx=null;}
  const t0=performance.now();
  const tick=()=>{const t=ctx&&ctx.currentTime>0?ctx.currentTime:(performance.now()-t0)/1000;sc.frame(t);raf=requestAnimationFrame(tick);};
  tick();
 }
 const AUTO=location.hash==='#auto';
 if(AUTO){ready.then(()=>{start.classList.add('off');run();}).catch(()=>{});}
 start.addEventListener('click',()=>{ready.then(()=>{start.classList.add('off');run();});});
 canvas.addEventListener('click',()=>{if(sc)run();});
})();
</script></body></html>
