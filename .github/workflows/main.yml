name: Build Nightround APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
  uses: android-actions/setup-android@v3
  with:
    accept-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Find Android project
        id: project
        shell: bash
        run: |
          if [ -f gradlew ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f project-main/gradlew ]; then
            echo "dir=project-main" >> "$GITHUB_OUTPUT"
          else
            echo "Gradle wrapper tidak ditemukan."
            exit 1
          fi

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nightround-debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          
